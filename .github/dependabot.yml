version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # patch et minor groupés ; les majeures restent une PR chacune (hors groupe).
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Paquets dont la version est IMPOSÉE par le SDK Expo : un par un, Dependabot propose des montées
      # incompatibles entre elles (CI rouge : conflits de dépendances « peer »). Ils se montent ENSEMBLE,
      # à la main, avec `npx expo install --fix` lors d'une montée du SDK (cf. docs/AUDIT_SECURITE_2026-11.md, A1).
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "@types/react"
      - dependency-name: "react-test-renderer"
      - dependency-name: "test-renderer"
      # ESLint 10 : `eslint-config-expo` / `eslint-plugin-import` n'acceptent que ESLint <= 9 (CI rouge).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 : refusé sur le back (typescript-eslint 8 ne l'accepte pas) ; même chaîne de lint ici.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
