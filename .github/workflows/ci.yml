name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Un seul run par branche : un nouveau commit annule le run en cours.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances (sans scripts)
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint (0 warning toléré)
        run: npm run lint -- --max-warnings 0

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Audit des dépendances de production
        # Seuil « critical » pour l'instant : l'app a 6 avis HAUTS dont le correctif impose de changer
        # le SDK Expo (decode-uri-component via expo-router) ou concerne des outils de build non livrés
        # (@expo/cli, node-forge). Voir docs/AUDIT_SECURITE_2026-11.md (A1). À repasser à « high »
        # après la montée du SDK Expo.
        run: npm audit --omit=dev --audit-level=critical

  gitleaks:
    name: Secrets (gitleaks, historique complet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz, identique à celui du fichier
      # checksums.txt officiel de la release. À changer avec la version.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Récupérer tout l'historique
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer gitleaks (version épinglée, somme vérifiée avant exécution)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check -
          tar -xzf "$archive" gitleaks

      - name: Scanner l'historique
        # --redact : la valeur d'un secret n'apparaît jamais dans les logs.
        run: ./gitleaks git . --log-opts="--all" --redact=100 --no-banner --verbose
